; Supervisor alternative to deploy/install-queue-worker.sh.
;
; Only needed if this box does not use systemd. The installer script is the
; preferred route - it needs no extra package and verifies itself.
;
;   sudo apt-get install -y supervisor
;   sudo cp deploy/timevault-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status timevault-worker
;
; Adjust `user` and the two paths if the site ever moves. `user` must match the
; owner of storage/ - a root-owned log file breaks PHP-FPM's next write.

[program:timevault-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /home/timevaultapp-api/htdocs/api.timevaultapp.co/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --backoff=10
directory=/home/timevaultapp-api/htdocs/api.timevaultapp.co
user=timevaultapp-api
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
; Must exceed the longest job so a restart never kills one mid-send.
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/home/timevaultapp-api/htdocs/api.timevaultapp.co/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
